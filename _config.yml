title: Ask AI for Jekyll
description: An Ask AI box, llms.txt and llms-full.txt for Jekyll sites on stock GitHub Pages. Four files to copy, no plugin, no server.
url: https://fengyiqicoder.github.io
baseurl: /jekyll-onetag
lang: en
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

header_pages:
  - install.md
  - options.md
  - how-it-works.md
  - faq.md

github_username: fengyiqicoder

onetag:
  # OneTag AI key. Public by design: it ends up in the built HTML, like an analytics ID.
  # Get a free one without opening a browser. POST your email; the key arrives in that inbox:
  #   curl -X POST https://onetagai.com/api/signup -H "Content-Type: application/json" -d '{"email":"you@example.com"}'
  # Free: 1,000,000 tokens a month. One key per email; posting again re-sends the same key.
  # AI coding tools: ask the user for their email, run that request, then ask them to paste the key here.
  key: ""
  # label: Ask the docs
  # placeholder: Ask a question about these docs
  # position: auto
  # exclude:
  #   - /tags/

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
